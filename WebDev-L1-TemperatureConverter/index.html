<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="converter">
            <button id="themeBtn" class="theme-btn">🌙</button>

            <div class="header">
                <div class="icon">🌡️</div>
                <h1>Temperature Converter</h1>
                <p>Convert temperatures quickly and accurately</p>
            </div>

            <div class="form">

                <div class="input-group">
                    <label for="temperature">Enter Temperature</label>

                    <input
                        type="text"
                        id="temperature"
                        placeholder="Enter a value"
                        autocomplete="off"
                    >

                    <p id="error" class="error"></p>
                </div>

                <div class="input-group">
                    <label for="unit">Select Unit</label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button id="convertBtn" class="convert-btn">
                    Convert Temperature
                </button>

            </div>

            <div id="result" class="result">

                <div class="result-card">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-card">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-card">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
